stages:
  - test

run_qa_push:
  stage: test
  tags:
    - "#1team"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "main"'
  cache:
    key: "$CI_COMMIT_REF_SLUG"
    paths:
      - venv/
  before_script:
    - rm -f ~/.bash_logout
    - mkdir -p src/resources
    - cp "$CREDENTIALS_JSON" ./src/resources/credentials.json
    - sudo apt-get update
    - sudo apt-get install -y chromium-browser chromium-chromedriver xvfb python3-tk python3-dev
    - python3 -m venv venv
    - source venv/bin/activate
    - pip install --upgrade pip
    - pip install -r requirements.txt
  script:
    - mkdir -p reports/logs reports/screenshots reports/downloads
    - TEST_CHANGED=$(git diff --name-only HEAD~1 HEAD -- 'tests/*.py' 'tests/**/*.py' | grep -v test_clipboard_format_preserved.py | tr '\n' ' ' || true)
    - SRC_CHAT=$(git diff --name-only HEAD~1 HEAD -- 'src/pages/chat/*.py' | tr '\n' ' ' || true)
    - SRC_TOOL=$(git diff --name-only HEAD~1 HEAD -- 'src/pages/tool/*.py' | tr '\n' ' ' || true)
    - SRC_AUTH=$(git diff --name-only HEAD~1 HEAD -- 'src/pages/auth/*.py' | tr '\n' ' ' || true)
    - SRC_OTHER=$(git diff --name-only HEAD~1 HEAD -- 'src/pages/system/*.py' 'src/utils/*.py' 'src/config.py' | tr '\n' ' ' || true)
    - |
      if [ -n "$SRC_OTHER" ]; then
        echo "공통 모듈 변경 → 전체 테스트 실행"
        xvfb-run pytest tests/ --tb=short --ignore=tests/chat/test_clipboard_format_preserved.py --ignore=tests/chat/test_math_formula_renders_correctly.py || true
      else
        TARGETS=""
        [ -n "$SRC_CHAT" ] && TARGETS="$TARGETS tests/chat/"
        [ -n "$SRC_TOOL" ] && TARGETS="$TARGETS tests/tool/"
        [ -n "$SRC_AUTH" ] && TARGETS="$TARGETS tests/auth/"
        [ -n "$TEST_CHANGED" ] && TARGETS="$TARGETS $TEST_CHANGED"
        if [ -n "$TARGETS" ]; then
          echo "변경 감지 → 실행: $TARGETS"
          xvfb-run pytest --tb=short $TARGETS --ignore=tests/chat/test_clipboard_format_preserved.py --ignore=tests/chat/test_math_formula_renders_correctly.py || true
        else
          echo "변경된 테스트 없음"
        fi
      fi
  artifacts:
    when: on_failure
    paths:
      - reports/screenshots
    expire_in: 1 week

run_qa_schedule:
  stage: test
  tags:
    - "#1team"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
  cache:
    key: "$CI_COMMIT_REF_SLUG"
    paths:
      - venv/
  before_script:
    - rm -f ~/.bash_logout
    - mkdir -p src/resources
    - cp "$CREDENTIALS_JSON" ./src/resources/credentials.json
    - sudo apt-get update
    - sudo apt-get install -y chromium-browser chromium-chromedriver xvfb python3-tk python3-dev default-jre
    - python3 -m venv venv
    - source venv/bin/activate
    - pip install --upgrade pip
    - pip install -r requirements.txt
    # allure CLI 설치
    - curl -o allure.tgz -L https://github.com/allure-framework/allure2/releases/download/2.27.0/allure-2.27.0.tgz
    - sudo tar -zxvf allure.tgz -C /opt/
    - sudo ln -sf /opt/allure-2.27.0/bin/allure /usr/local/bin/allure
  script:
    - mkdir -p reports/logs reports/screenshots reports/downloads reports/allure-results
    - xvfb-run pytest ${TEST_PATH:-tests/} --tb=short --ignore=tests/chat/test_clipboard_format_preserved.py --ignore=tests/chat/test_math_formula_renders_correctly.py --junitxml=reports/result.xml --alluredir=reports/allure-results || true
    - allure generate reports/allure-results -o reports/allure-report --clean || true
  artifacts:
    when: always
    paths:
      - reports/allure-report/
      - reports/screenshots/
      - reports/result.xml
    reports:
      junit: reports/result.xml
    expire_in: 1 week

